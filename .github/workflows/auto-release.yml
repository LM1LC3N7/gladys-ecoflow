# -----------------------------------------------------------------------------
# Cut a patch release automatically the moment a Dependabot PR actually
# merges into main (whether merged by dependabot-auto-merge.yml or by a human
# clicking merge on a Dependabot PR) — the "new releases ship on their own"
# half of keeping dependencies current; see .github/workflows/
# dependabot-auto-merge.yml for which PRs merge on their own in the first
# place, and release.yml for the same version-bump logic driven by hand.
#
# Triggered by `pull_request: closed`, not a push-to-main heuristic: a
# squash-merge commit's reported author can vary by how it was merged, so
# checking the PR event itself (github.event.pull_request.user.login,
# github.event.pull_request.merged) is the only reliable way to fire exactly
# once per actually-merged Dependabot PR, and only then — never on this
# workflow's own release commit (that push has no associated PR at all).
# -----------------------------------------------------------------------------
name: Auto-release dependency updates

on:
  pull_request:
    types: [closed]

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bump version and update the manifest
        id: bump
        run: |
          set -euo pipefail

          new_version="$(npm version patch --no-git-tag-version | tail -n1)"
          new_version="${new_version#v}"

          if git ls-remote --exit-code --tags origin "refs/tags/v${new_version}" >/dev/null; then
            echo "::notice::Tag v${new_version} already exists on origin — a release for this version was likely already cut, skipping."
            git checkout -- package.json package-lock.json
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}:${new_version}"

          tmp="$(mktemp)"
          jq --arg version "$new_version" --arg image "$image" \
            '.version = $version | .docker_image = $image' \
            gladys-assistant-integration.json > "$tmp"
          mv "$tmp" gladys-assistant-integration.json
          npx --yes prettier --write gladys-assistant-integration.json

          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json gladys-assistant-integration.json
          git commit -m "chore(release): ${VERSION}"
          git tag -a "v${VERSION}" -m "Release ${VERSION}"

          git push origin "HEAD:${BASE_REF}"
          git push origin "v${VERSION}"

      - name: Create the GitHub Release
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v${VERSION}" --generate-notes

  build:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.release.outputs.version }}
