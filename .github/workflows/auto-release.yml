# -----------------------------------------------------------------------------
# Cut a patch release automatically the moment a Dependabot PR that changes
# the SHIPPED image merges into main (whether merged by
# dependabot-auto-merge.yml or by a human): the Docker base image, a runtime
# npm dependency, or a transitive one (security updates). Dev dependencies
# and GitHub Actions bumps change nothing for users, so they cut no release —
# otherwise every Gladys instance would show "update available" for nothing.
# release.yml keeps the same version-bump logic for releases cut by hand.
#
# Triggered by `pull_request: closed`, not a push-to-main heuristic: checking
# the PR event itself (merged + author) fires exactly once per merged
# Dependabot PR, never on this workflow's own release commit (that push has
# no associated PR at all).
# -----------------------------------------------------------------------------
name: Auto-release dependency updates

on:
  pull_request:
    types: [closed]

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Does this update change the shipped image?
        id: scope
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
        run: |
          runtime=false
          case "$ECOSYSTEM" in
            docker) runtime=true ;;
            npm_and_yarn | npm) [ "$DEPENDENCY_TYPE" != "direct:development" ] && runtime=true ;;
          esac
          if [ "$runtime" = "true" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${ECOSYSTEM} ${DEPENDENCY_TYPE} update: nothing shipped changes, no release."
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.scope.outputs.runtime == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.scope.outputs.runtime == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Bump version and update the manifest
        id: bump
        if: steps.scope.outputs.runtime == 'true'
        run: |
          set -euo pipefail

          new_version="$(npm version patch --no-git-tag-version | tail -n1)"
          new_version="${new_version#v}"

          if git ls-remote --exit-code --tags origin "refs/tags/v${new_version}" >/dev/null; then
            echo "::notice::Tag v${new_version} already exists on origin — a release for this version was likely already cut, skipping."
            git checkout -- package.json package-lock.json
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}:${new_version}"

          tmp="$(mktemp)"
          jq --arg version "$new_version" --arg image "$image" \
            '.version = $version | .docker_image = $image' \
            gladys-assistant-integration.json > "$tmp"
          mv "$tmp" gladys-assistant-integration.json
          npx --yes prettier --write gladys-assistant-integration.json

          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json gladys-assistant-integration.json
          git commit -m "chore(release): ${VERSION}"
          git tag -a "v${VERSION}" -m "Release ${VERSION}"

          git push origin "HEAD:${BASE_REF}"
          git push origin "v${VERSION}"

      - name: Create the GitHub Release
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v${VERSION}" --generate-notes --repo "$GITHUB_REPOSITORY"

  build:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.release.outputs.version }}
