# -----------------------------------------------------------------------------
# Dependabot version updates.
#
# Opens a PR by itself when a newer version is available, for the three
# places this repo pins a version: npm packages, the Dockerfile base image
# (tag + digest: a rebuilt `node:24-alpine` with security fixes arrives as a
# digest bump), and the GitHub Actions the workflows use. Every PR runs the
# full ci.yml suite — see .github/workflows/dependabot-auto-merge.yml for
# which of these Dependabot then merges on its own once that run is green,
# and .github/workflows/auto-release.yml for which merges cut a release.
#
# `target-branch: main` keeps every PR aimed at main whatever the repository
# default branch setting says (it pointed elsewhere when this repo started).
# -----------------------------------------------------------------------------
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: 'development'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  - package-ecosystem: 'docker'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    # A new Node major is a deliberate change (odd majors are never LTS, and
    # the image should follow the LTS line the Gladys core runs on): only
    # minor/patch tags and digest updates are proposed automatically.
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'
